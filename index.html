<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre de Operações - Supervisão & Gestão</title>
  <style>
    :root {
      --bg-main: #070d18;
      --bg-card: #0f172a;
      --bg-card-hover: #1e293b;
      --border: #1e293b;
      --border-accent: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #050811;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand span {
      background: #1e293b;
      color: var(--accent-amber);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover { opacity: 0.88; }

    .btn-primary { background: var(--accent-blue); color: #fff; }
    .btn-purple { background: var(--accent-purple); color: #fff; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-accent);
      color: var(--text-muted);
    }
    .btn-outline.active {
      background: #1e293b;
      color: #fff;
      border-color: var(--accent-cyan);
    }
    .btn-action {
      background: #1e293b;
      border: 1px solid var(--border-accent);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 6px 10px;
    }

    main {
      padding: 18px 24px;
      flex: 1;
    }

    /* DASHBOARD KPIS */
    .dashboard-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .kpi-card:hover { border-color: var(--accent-cyan); }
    .kpi-card .kpi-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .kpi-card .kpi-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; }
    .kpi-card.kpi-blue .kpi-val { color: var(--accent-cyan); }
    .kpi-card.kpi-green .kpi-val { color: var(--accent-green); }
    .kpi-card.kpi-red .kpi-val { color: var(--accent-red); }
    .kpi-card.kpi-purple .kpi-val { color: var(--accent-purple); }

    /* FILTROS */
    .filter-bar {
      margin-bottom: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-bar input, .filter-bar select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent-cyan); }

    /* KANBAN */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .kanban-col {
      background: #090f1d;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .col-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .col-header .counter {
      background: #1e293b;
      color: #94a3b8;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-family: monospace;
    }

    .col-tasks {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      cursor: grab;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { background: var(--bg-card-hover); border-color: var(--accent-cyan); }
    .card.card-overdue { border-left: 4px solid var(--accent-red); }
    .card.card-cte { border-left: 4px solid var(--accent-purple); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badges-group {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-operacional { background: #0369a1; color: #fff; }
    .badge-atendimento { background: #059669; color: #fff; }
    .badge-comercial { background: #d97706; color: #fff; }
    .badge-financeiro { background: #7c3aed; color: #fff; }
    .badge-concluido { background: #334155; color: #cbd5e1; }
    .badge-atrasado { background: var(--accent-red); color: #fff; }
    .badge-ontime { background: #065f46; color: #34d399; }

    .badge-prioridade-critica { background: #ef4444; color: #fff; }
    .badge-prioridade-alta { background: #ea580c; color: #fff; }
    .badge-prioridade-media { background: #ca8a04; color: #fff; }
    .badge-prioridade-baixa { background: #0284c7; color: #fff; }
    .badge-prioridade-sem { background: #475569; color: #cbd5e1; }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .card-meta strong { color: #cbd5e1; }

    .meta-dono { color: #38bdf8 !important; }
    .meta-parado {
      color: #f59e0b !important;
      background: rgba(245, 158, 1
